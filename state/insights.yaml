    arg-select per-K over N. When the match relation is INJECTIVE from the N side (each position matches at most
    one lane -- task233: sprite popcounts sampled without replacement 4..8 => 9-bit window hashes distinct across
    lanes), the [K,N] comparison is a function N->K and can be materialized inversely: scatter position-ids keyed
    by hash into a [1,H] table (ScatterElements, duplicate-index last-wins = ORT sequential; H = hash space, 512
    for 9-bit), then Gather the K lane keys. Kills the [K,N] fp16 TopK feed (Kaggle dtype-locked), the [K,N] bool
    Equal, AND the TopK itself. Sequential consume-once fallback machinery (k=2 lanes) is usually exercised by only
    a handful of bundled examples under the overfit gate -- patch those with per-example pos-override lanes (Where
    chains keyed on a cheap unique runtime signature) at ~25B each.'
