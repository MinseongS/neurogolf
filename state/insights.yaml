- id: free_epilogue_conv_bias_lights_the_pad
  title: The free 1x1-QLinearConv epilogue fails whenever a colour channel needs a constant offset
  status: active
  source_tasks:
  - 219
  - 191
  - 023
  - 204
  - 019
  rationale: 'The "free epilogue" (stack a few small working planes -> ONE 1x1 QLinearConv doing the colour channel
    map AND the canvas pad via `pads=[...]` straight into the free `output`) landed real wins on task023 (6348->4814),
    task204 (10232->7838) and task219 (7210->5258), but it has a hard, twice-independently-rediscovered limit:
    a conv BIAS fires uniformly, including over the `pads` region (pad contributions are always zero because
    x - x_zero_point == 0 there). So any output channel whose value needs a constant additive term — typically the
    black/background channel needing +1 — lights up OUTSIDE the real grid, and since the grader does
    `np.array_equal` on the FULL [1,10,30,30] with all-zero expected off-grid, the net fails. task219 had to supply
    the constant as a data plane (a ones initializer, 150 params) because the bias route is closed; task191 priced
    every variant (ones initializer, extra conv output channel, Concat) and each cost >= what it saved, so
    `Equal(Pad(color, sentinel))` stayed the cheaper primitive there. task019 sharpens the boundary: the positive
    background constant can be supplied as a compact runtime rectangle plane R instead of a bias, while a negative
    cyan offset remains safe in bias because padded positions saturate to uint8 zero. A runtime channel-weight bank
    built from the detected active colour then maps compact M=point, D=diagonal-count, R=in-grid planes straight into
    the FREE padded output. This deleted the final 900B label Pad plus 288B routing carriers and improved
    cost 2503->1952 (+0.248636), with bundled 267/267 and fresh 6000/6000 exact.'
  applies_when:
    any_ops:
    - QLinearConv
    - Conv
    - Pad
    any_tags:
    - onehot_final_equal
  reject_when: {}
  expected:
    gain_type: mechanism + its boundary
    risk: silent off-grid channel activation -> fail on every example, caught by the gate
    verification: 'Before choosing the free-epilogue route, check whether every output channel is a PURE linear
      combination of the stacked planes with NO constant term. If any channel needs a constant, price the data-plane
      workaround (ones initializer / extra conv output channel / Concat) against simply keeping
      `Equal(Pad(code_plane, sentinel), decode[1,10,1,1])` — the latter often wins. Choosing the colour codes so that
      the needed constant vanishes (e.g. making the sentinel/off-grid value 0 and decoding against a non-zero
      palette), or supplying the constant as a compact data plane that is zero in the Conv padding (task019), is the
      way to keep the free epilogue. Runtime QLinearConv weights are legal under pinned ORT 1.26 and can specialize
      the channel map from a small detected-colour vector without materializing a spatial carrier.'
  transformer: null
- id: entry_crop_fitted_to_bundled_max_not_rule_max
  title: Nets whose entry crop is 1-2 cells short of the max grid are fitted to the bundle, not the rule — a live local!=LB risk
  status: active
  source_tasks:
  - 101
  - 158
  - 138
  rationale: 'The standard prologue `Conv(input, cmap[1,10,1,1], pads=[0,0,-A,-B])` crops the 30x30 canvas to the
    real grid. Several deployed nets crop to the largest grid that happens to appear in their BUNDLED data rather
    than to the rule''s true maximum, so they pass 266/266 locally while being blind to cells a different generator
    seed can populate. Because the grader needs fail==0 for ANY points, one such hidden example scores the whole
    task 0 — this is a total loss, and it is a strong candidate for the long-standing "task101-class local!=LB
    divergence" the ledger keeps hitting. Board scan 2026-07-15 (entry-Conv negative pads vs max INPUT grid over all
    bundled examples): 9 nets crop below their max input, but most are legitimate (the rule only needs a strip —
    e.g. task249 crop=(30,2), task200 crop=(1,10)). The suspicious signature is a crop 1-2 cells SHORT of the max:
    task101 crop=(17,20) vs max (17,21) — an agent measured a hard ORT OOB-Gather crash on 14.6% of 17x21 grids,
    and the single bundled 17x21 example passes only by luck (P(>=1 crash over 266 hidden draws) ~13.6%);
    task158 crop=(25,24) vs max (26,25); task138 crop=(24,23) vs max (26,25). task101''s crop regression is
    documented: S8 fixed this class on 2026-07-02 and the 20260709 public-dump min-merge reverted it.
    THIRD INDEPENDENT INSTANCE (task285, same day, different shape — this generalises beyond crops):
    its in-grid test was `input[channel 0, row 0, col c]`, i.e. "cell (0,c) is colour 0", which is FALSE for a
    COLOURED cell in row 0 — so any sprite touching row 0 blanked that whole row/column. It also assumed H==W.
    0/265 bundled inputs have a coloured cell in row 0 or col 0, so it never fires locally; a hidden seed placing a
    sprite in row 0 scores task285 zero. Fixed 2026-07-15 by the conv_bias_sentinel rebuild (a true in-grid test via
    an off-grid sentinel from the entry Conv bias), which also removed 3 runtime errors per 4000 fresh instances.
    THE GENERAL PATHOLOGY: a net bets on an invariant that holds over the bundle but is not part of the RULE, and
    the local gate (bundled fail==0) is structurally incapable of catching it. Crop extent is only one shape of this;
    "colour 0 in row 0", "H==W", and "the generator never clips a reflection" are others.'
  applies_when:
    any_ops:
    - Conv
    - Slice
    any_tags:
    - onehot_final_equal
  reject_when: {}
  expected:
    gain_type: risk register (expected-value, not a cost win)
    risk: total loss of the task (scores 0) on any hidden draw that populates the cropped-away cells
    verification: 'Scan: extract the entry op''s negative `pads` -> crop extent, compare against
      max(len(e["input"]), len(e["input"][0])) over train+test+arc-gen. A crop 1-2 short of the max is the red flag;
      a crop far below the max is usually a legitimate strip read — check the rule before calling it a bug.
      Widening the crop costs bytes (task101: comb 1360->1428B plus downstream, ~-0.08 points), so it is an
      expected-value call: -0.08 certain vs -15.6 at the measured hazard rate. Do NOT "fix" without first
      establishing whether the LB hidden set is redrawn per submission or fixed — if fixed and the task currently
      scores (LB ~= local), the fix buys nothing.'
  transformer: null
