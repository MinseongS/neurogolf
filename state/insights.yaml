  - 354
  rationale: 'Task048 produced a fixed `[1,1,30,1]` fp32 packed-row Conv result (120B), then kept
    rows 0:8 in a second `[1,1,8,1]` Slice (32B). Setting the Conv pads to
    `[0,0,-22,0]` makes the Conv itself emit exactly those eight rows, so the Slice and its two
