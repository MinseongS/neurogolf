  rationale: 'S8 additions (late): EXACT-COUNT walks via 3-phase monotone machine {Stay,Move...} — each cell reached
    by exactly one walk, einsum value = run length/area, fp16-exact <=2048 (task145, refutes FLOOR verdicts on size/area
    tasks); checkerboard-parity paint via rank-1 stacked-parity einsums (task286); latency: repeated-operand SIZE
    dominates ORT multi-op einsum (use one small mask plane over repeating the 9000-elem input); single-tap KxK
    Conv = free crop. S8 additions: free-traversability (input repeated with (10,) colour selectors, shared colour
    letter pinned by P0[q] -> 1 letter/4-conn step, no t plane; task243), checkpoint constraints (triangular operands
    bind walk positions to output indices -> bbox conditions in-einsum; task077), gates-as-einsum-operands (data-dependent
    [K] selection vectors from tiny einsums multiply inside the big einsum, stacked fallback plane; task110). Original:
    Grader counts only NODE OUTPUTS (data/neurogolf_utils.py calculate_memory); everything inside a single op is
    free, and run_network applies a free >0 threshold at ''output''. Reachability = #walks > 0 is a polynomial in
    the input, so K propagation steps compile into ONE Einsum: operands G[m,r0],H[m,c0] (nonneg rank-terms for the
    seed set), then per step S[r_j,r_j+1], S[c_j,c_j+1] (tridiagonal-with-self, entries 0.5 -> 8-connected Chebyshev
    step; alternate single-axis S for 4-connected at 1 letter/step), and t[n,z,r_j,c_j] (traversable plane from
    one Conv). All operand values nonnegative -> no cancellation -> fp32 rounding/overflow cannot flip >0 semantics;
    keep per-step scale dyadic (0.5) so min path weight stays in normal-float range (subnormal-flush-safe). Letter
    budget 52: 8-conn = (52-5)/2 = 23 steps/einsum; 4-conn alternating H/V = 45 steps. task187 landed: 15 MaxPool+Min
    rounds (18.75KB) -> 1 Einsum (74 operands, 51 letters): mem 32850->15300, 14.58->15.29 (+0.71), fresh 17<=19
    incumbent, and Kaggle grader accepts it (task313 = kojimar''s 10-operand einsum precedent; 187 A/B submitted).
    Same-arity constraint: one einsum sums only uniform operand-set products, so heterogeneous output composition
    (drawing-copy + flood colours) still needs the classic uint8 label epilogue (~11.7KB floor here: t 3600 + W
    3600 + label 3600+900 + 4x900 bool/uint8 planes). 2026-07-16 task243 then removed the
