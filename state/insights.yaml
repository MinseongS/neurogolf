    fresh2000 divergence0, and exact source/candidate/deployed SHA equality. A final
    payload-carrying score replaces each exact-box count b with 512*b plus the row-major
    9-bit blue pattern, while each background cell contributes -4096. Count priority and
    invalid-window rejection remain strict, so MaxPool needs only its scalar value. UINT16
    Mod by [2..512] plus GreaterOrEqual against [1..256] decodes the selected patch and
    deletes indices, coordinates, Slice bounds, and the FLOAT patch. This changed 411->366
    (+0.115960), passed bundled267/267, synthetic all-position decoding, fresh2000
    divergence0, and exact source/candidate/deployed SHA equality. The final decoder
    follow-up replaces UINT16 Mod/GreaterOrEqual plus UINT8 Cast/BitShift with opset18
    UINT16 BitwiseAnd, BOOL Cast, and centered UINT8 Where. It changed366->350
    (+0.044700), passed payload512/512, positions49/49, bundled267/267, fresh2000
    divergence0, and exact SHA equality. INT8 Where is NOT_IMPLEMENTED in ORT1.26;
