- id: structural_cost_floor_law
  title: Per-task cost floor is 5*A_in + min(900, 10*A_out) + params, set by the f32 input and the canvas broadcast
  status: active
  source_tasks:
  - 368
  - 091
  - 333
  - 076
  rationale: 'Board-wide derivation (2026-07-15). points = max(1, 25 - ln(memory+params)); `input` and `output`
    are the only free tensors (scoring.py skips them by name), and `params` is ELEMENT COUNT, not bytes, so
    initializer dtype is irrelevant and only weight SHAPE cuts params. Three costs are then forced. (1) The graph
    input is float32 [1,10,30,30], and every op that reduces the 10 one-hot channels to a label plane (Conv/Einsum/
    MatMul/Reduce*) is dtype-preserving, while every dtype-narrowing op (Cast/QuantizeLinear/Equal/Greater) is
    elementwise at full [1,10,30,30] = 9000B. So the cheapest entry is Conv(input, cmap[1,10,1,1], pads=negative-crop)
    -> f32 [1,1,h,w] costing 4*A_in, plus A_in for the u8 working plane it is Cast to: 5*A_in total, unavoidable.
    (2) Producing the [1,10,30,30] output by broadcasting a label plane against a [1,10,1,1] decode vector needs a
    [1,1,30,30] tensor = 900B; the alternative (broadcast at working resolution, then Pad -> output for free, which
    is CORRECT because outside the ARC grid all 10 output channels are zero, verified) costs 10*A_out. Hence
    min(900, 10*A_out). (3) params. Measured against this floor the whole 400-task board holds only ~+75 points of
    headroom, ~71% of it in the 14-17 band, and the deployed nets already sit at the floor almost everywhere.'
  applies_when:
    any_tags:
    - onehot_final_equal
    - mem0_single_op
  reject_when: {}
  expected:
    gain_type: prioritization
    risk: none — this is a pricing model, not a rewrite
    verification: 'Price any rebuild BEFORE building it. A design materializing a full 10-channel canvas plane
      ([1,10,30,30] u8 = 9000B) is capped near 15.9 points; one materializing a single [1,1,30,30] u8 plane (900B)
      or carrying a dense Conv[10,10,3,3] (900 params) is capped at 18.20. Reaching >=20 points requires cost<=148,
      i.e. NO full-grid intermediate at all AND a weight of <=148 elements. Empirically points ~= f(node count):
      the 20-26 band averages 2.2 nodes/53 params, the 14-17 band 70.2 nodes. Node count is the currency at roughly
      40-100B per node.'
  transformer: null
