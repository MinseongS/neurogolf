    - terminal_onehot
    - free_output
    notes: 'The label range and class constants must keep x^2 and every coefficient inside the
      selected integer dtype. Preserve or create the channel axis upstream when possible, because
      a counted Unsqueeze can erase the 9.5% saving on small graphs.'
  reject_when:
