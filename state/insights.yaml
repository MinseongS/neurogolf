  - 354
  rationale: 'Tasks036, 037, 046, 062, and 354 ended with a compact uint8 label grid, Equal against ten class
    constants, and Pad into the FREE boolean output. Equality to class k is exactly the sign test
    `1-(x-k)^2 > 0` for integer x. Keeping x, forming x^2 and a constant-one plane, and applying a
    terminal ConvInteger with per-class weights `[2k,-1,1-k^2]` writes the padded logits directly
    into the FREE output. Task036 replaced a counted 250B one-hot with 75B features and reduced
    cost 1051->940 (+0.111618). Task046 preserved an existing singleton axis through the upstream
    Gather/Squeeze path, avoiding a counted Unsqueeze; it replaced a 480B one-hot with 144B
    features and reduced cost 2075->1846 (+0.116940). Task354 applied the same polynomial after a
    data-dependent SameRun producer: its existing 10x10 label plane made the producer complexity
    irrelevant to the terminal renderer, and replacing Pad(label)->Equal(classes) first reduced
    cost 2064->1677 (+0.207639). It then reserved code1 for padding and moved the polynomial
    constant into QLinearConv bias, reaching 1479 cumulatively (+0.333280). Task069 uplifted
    opset13->14 to legalize uint8 Mul and folded its 10x10
    outplane tail; augmented A/B kept both existing QLinearConv nodes and all 29 upstream outputs
    exact, changing cost 2919->2530 (+0.143022). An exhaustive tail probe checked labels 0..9 and
    all padded logits, while task037 independently proved ScatterElements emitted the full label set 0..9 and every
    off-grid raw logit was zero; its exact-target fold reduced cost 2414->2027 (+0.174728).
    Task062 derived rows from the intentional class vector `[0,1,0,3,4,5,6,7,8,9]`, preserving
    both positive channels for label0 while changing cost 2524->2149 (+0.160842). Every listed
    adoption passed its complete bundled gate.'
  applies_when:
