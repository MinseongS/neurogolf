    verification: 'Dequantize every candidate kernel first: effective weight is
      `(W_raw-w_zero_point)*w_scale`. A channel is dead only when every effective weight is exactly
      zero (normally raw value equals the weight zero-point), and its bias/scale interactions are
      also neutral. Then require bundled A/B and `ng gate`.'
