    zeros in input channel 0. The attempted graph reached the predicted cost 1033, but passed only
    3/267 bundled examples. The kernels use `w_zero_point=1`, so their effective weights are
    `W_raw-1`; every stored zero is actually -1 and the background channel is load-bearing. Raw
    initializer sparsity is therefore not semantic sparsity in QLinearConv.'
