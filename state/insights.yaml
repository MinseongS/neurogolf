- id: threshold_linearize_pairwise_onehot_and
  title: Replace pairwise one-hot AND/Kronecker products with direct thresholded product scores
  status: active
  source_tasks:
  - 1
  rationale: 'Task001''s Kronecker self-product looked multiplicative, but the official verifier thresholds output
    > 0.  One-hot pairwise equality/AND can be encoded as signed scores, removing the counted 10-channel 9x9 carrier.  The
    final adopted family emits the full 30x30 output directly with one Einsum: dense macro/micro coordinate selectors
    plus a symmetric rank-3 channel factor fitted only on reachable monochrome input states.  This improved task001
    from 17.978 to 19.519 with mem 0 and params 240.  The remaining cost is mostly dense spatial routing (macro/micro
    [3,30] = 180); sparse initializer versions would explain a 94-ish frontier but are rejected by official shape
    inference for Einsum sparse inputs.'
  applies_when:
    any_ops:
    - Einsum
    - Where
    - Equal
    - Pad
    any_tags:
    - lut_selection
    - onehot_final_equal
    - direct_onehot_gather_output
    max_points: 19.0
  reject_when:
    any_tags:
    - multi_colour_pair_product
    - requires_exact_numeric_output
  expected:
    gain_type: memory_by_deleting_boolean_product_carrier
    risk: medium; relies on one-hot inputs, positive-threshold scoring, and class-specific margins
    verification: stored eval plus fresh/adopt when generator samples exist; inspect off-footprint scores are non-positive
  transformer: null
- id: qlinear_uint8_lut_or_matmul
  title: Replace fp16/fp32 one-hot LUT/MatMul selection with uint8 QLinearMatMul/QLinearConv where exact
  status: active
  source_tasks:
  - 55
  - 80
  - 338
  - 255
  rationale: 'Task055 and task080 showed that quantized integer routing can collapse large fp16/fp32 selection planes
    when scales are 1 and zero-points are 0.  task338 extended this to a small thresholded run detector: fp16 Conv+bias(-2)+Relu
    for a 3-red horizontal wall is exactly bool->uint8 QLinearConv(sum3)+Equal(3), removing fp16 full-canvas planes
    and improving 15.414->15.552.  Task255 extended the same idea to a rank-8 boolean row/column product: fp16 Cast+MatMul+Greater
    became uint8 Cast+QLinearMatMul+Greater, preserving exact sums in [0,8] and reducing cost 8978->7598.'
  applies_when:
    any_ops:
    - MatMul
    any_tags:
    - lut_selection
    - onehot_final_equal
    min_memory: 500
  reject_when:
    any_tags:
    - mem0_single_op
    - qlinear
    - free_fp32_input_quantize_required
  expected:
    gain_type: memory
    risk: medium
    verification: stored eval, fresh eval if generator available, then adopt gate
  transformer: null
  measured_negative_2026_07_08:
    task233:
      what_was_run: Coverage-audit follow-up replaced sprite-window Conv(input, wspr)->vspr with QuantizeLinear(input)->QLinearConv(wspr_u8)->Cast
        in reports/candidates/task233/task233_qlinear_wspr_probe.onnx.
      tool_date: manual ONNX surgery + src.harness.evaluate, 2026-07-08
      result: Bundled fail=0 but cost worsened 32667 -> 42457 because QuantizeLinear(input) materializes a counted
        [1,10,30,30] uint8 carrier. Active Conv reads the fp32 graph input for free.
      reopen_trigger: Only reopen for task233-style detector Convs if an integer activation carrier already exists/shared,
        a QLinear path can consume free fp32 input without counted quantization, or a public/top-team task233 net
        beats our active cost.
      falsification_history: This corrects the coverage-audit false positive that treated task233 as an unapplied
        QLinear candidate.
