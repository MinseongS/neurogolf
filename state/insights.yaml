  rationale: 'calculate_memory walks every tensor''s inferred shape and bails with `return None` on
    `dim.HasField("dim_param")`, on a missing `dim_value`, and on `dim_value <= 0`. A None memory makes evaluate()
    report "performance could not be measured" and the task scores nothing at all — this is not a cost penalty, it
    is a total loss. Every shape in the graph must therefore be statically inferable to a positive integer.
