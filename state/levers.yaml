# NeuroGolf lever registry — single durable home for lever verdicts.
# Replaces prose-buried "exhausted/floor/ceiling" claims scattered across NEXT_SESSION/reports.
#
# EPISTEMIC RULE (binding): status is ONLY `live` or `dormant` — never "dead/exhausted/floor".
# A lever is dormant, not dead. Every ledger entry MUST carry exactly 4 fields:
#   date   — when the run/verdict was recorded
#   ran    — what was actually run (tool + scope)
#   verdict— the result (never a bare negative; always "not found by tool X at time T vs our net")
#   reopen — the concrete reopen-trigger that re-activates the lever
#
# Schema (every lever): name / status(live|dormant) / scanner(str|null) /
#   scanner_archive(str|null, git ref) / recipe(str|null) / agent_class(fable|opus) /
#   expected_yield(str) / ledger(list of {date, ran, verdict, reopen}).
# Extra keys are allowed on individual lever entries (schema is a minimum, not a cap) —
# see free-output-einsum-regime-crack, which folds in the full regime vein worklist.

levers:
  - name: concat-max-collapse
    status: live
    scanner: null
    scanner_archive: null
    recipe: state/tasks/task302.md
    agent_class: opus
    expected_yield: "+0.2~0.4/task on any net ending in Concat(A,B) -> QLinearConv[10,2,k,k]"
    ledger:
      - date: 2026-07-14
        ran: "task302 rebuild (opus): full LP/MILP single-plane separability sweep over every
          3-state and 4-state encoding direction (5x5 + 3x3 final kernels), window set saturated
          with 40k arc-gen instances; cutting-plane integer fit; fresh-gate 6000."
        verdict: "WIN +0.2469 (cost 1773 -> 1385, adopted). Concat(gray, fill-count) -> Max()
          folds two channels into ONE u8 plane; final QLinearConv [10,2,5,5] -> [10,1,5,5]
          halves params (500->250) and the Concat's 288B vanishes. The conv's x_zero_point
          supplies a 4th (off-grid) state for zero bytes/params. Also FALSIFIES task302's
          2026-07-01 'FLOOR re-confirmed / all dominant intermediates structurally forced'.
          3-state planes are LP-PROVED impossible here (ch8 needs black==offgrid, ch0 needs
          them distinct) — the 3x3 spread of the detection is what supplies the 4th state."
        reopen: "already live — scan every deployed net for the `Concat -> QLinearConv`
          signature (the grafted public-dump nets are the prime pool, they were fitted by
          gradient descent and never param-golfed). Gate = LP single-plane separability over
