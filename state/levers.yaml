    # --- folded in from reports/regime_vein_worklist.md (2026-07-09), which is deleted later ---
    # Lever: fold a 900B [30,30] output-routing mask into a free-output Einsum
    # (output>0 sign-decode; input/output free any dtype). Gate: bundled fail=0 +
    # cost < DEPLOYED (submission/overfit_nets/taskNNN.onnx).
    # LB trajectory this vein: 7264.67 → 7279.34 (~+14.7 LB), almost all regime cracks.
    done_tasks:  # cracked + adopted, by batch
      b1: [329, 303, 141, 33, 341]
      b2: [260, 75, 240, 159, 345, 109]
      b3: [295, 392, 398, 61, 51]   # b1-b3 = the 16/18 "16 cracks across 3 batches" milestone
      b4: [287, 94, 63, 199, 273, 224]
      b5: [246, 190]
      fp16_adoptions: [251, 268, 205, 222]
    floor_tasks: [112, 163, 99, 102, 62, 12, 348, 124, 354]  # 9 confirmed floors — 재공격 금지
    # boundary rule: mask = (arbitrary motif CONTENT) ⊛ (data-dependent 2-D POSITION),
    # OR a data-dependent run/coupling (task354 SameRun) → 900B u8 index-plane is cheapest;
    # every Einsum factorization prices higher.
    batch6_floored: [354, 90, 390, 154, 34, 168, 381]  # also do-NOT-re-attempt (batch6 DRY)
    pending_unconfirmed: [71]  # 71 = build broken/likely floor, NOT confirmed — 재공격 허용
    crack_condition:  # sharpened 3-property test (batch6) — cracks ONLY if ALL hold, else FLOOR
      - "1. GLOBAL-STATE routing (predicate from ≤~16 scalars: offset/size/color/count), NOT content at a data-dependent position, NOT a data-dependent run/coupling."
      - "2. The 900B plane is a Where ROUTING mask, NOT an Equal DECODE discriminator (label30→Equal→10ch = dense-recolor floor: 124/354/390)."
      - "3. Mask FRACTION high (≥~45%); low-fraction (~30%, e.g. 090) loses to non-mask compute. AND the fold's fp32 operands (co-bound to the free input) must stay < the 900B bool mask — needs genuinely low-rank/static routing, not per-cell placement matrices (this fp32-co-bind economics is why 168/381/034 floor even though structured)."
    next_targets:
      structured_untried: [268, 86]  # 268 frame+diagonal arms; 86 ring/frame stamp + color-remap
      deprioritize_near_floor: [251, 333, 42]  # 251 already fp16-adopted; 333 thin margin; 42 cross-scale FP risk
      long_tail: "re-run mask_dominance_scan --min-frac 0.20 for <0.30-fraction masks"
    conv_fp32_arsenal: [74, 80, 198, 216, 162, 2, 349]  # NOT bool/u8 Where-masks — need a NEW fold (collapse Conv/Slice into free-output contraction); biggest single-task upside if it works; unproven
    residual_lever: "mixed-dtype Einsum — CONFIRMED DEAD on ORT 1.26 (2026-07-09 직접 프로브 /tmp/mixed_dtype_probe*.py):
      Einsum·Conv 모두 fp32+fp16 operand 혼합을 REJECT(uniform-T). fp32 free input과 fp16 carrier를 한 op에서
      co-bind하는 경로는 존재하지 않음. 이 레버를 open으로 취급 금지(5+ 에이전트가 반복 지목했으나 반증됨).
      대체 (ACCEPT 확인): REDUCE-THEN-CAST — detection plane이 reduced form(row/col profile/count)으로만 필요하면
      fp32로 reduce(작은 counted 중간텐서)한 뒤 Cast fp16 → 이후 전부 fp16 Einsum. per-task(detection이 축소 가능할 때만),
      universal unlock 아님. Full-plane cast(input→fp16 18000B / →u8 9000B via QuantizeLinear)만 accept되나 이득 없음."

