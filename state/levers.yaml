# NeuroGolf lever registry — single durable home for lever verdicts.
# Replaces prose-buried "exhausted/floor/ceiling" claims scattered across NEXT_SESSION/reports.
#
# EPISTEMIC RULE (binding): status is ONLY `live` or `dormant` — never "dead/exhausted/floor".
# A lever is dormant, not dead. Every ledger entry MUST carry exactly 4 fields:
#   date   — when the run/verdict was recorded
#   ran    — what was actually run (tool + scope)
#   verdict— the result (never a bare negative; always "not found by tool X at time T vs our net")
#   reopen — the concrete reopen-trigger that re-activates the lever
#
# Schema (every lever): name / status(live|dormant) / scanner(str|null) /
#   scanner_archive(str|null, git ref) / recipe(str|null) / agent_class(fable|opus) /
#   expected_yield(str) / ledger(list of {date, ran, verdict, reopen}).
# Extra keys are allowed on individual lever entries (schema is a minimum, not a cap) —
# see free-output-einsum-regime-crack, which folds in the full regime vein worklist.

levers:
